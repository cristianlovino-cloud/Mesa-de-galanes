<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa de Galanes · Live</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#080808;
  --panel:#111;
  --gold:#f5c518;
  --green:#2ecc71;
  --red:#e74c3c;
  --blue:#3498db;
  --ink:#e8e8e8;
  --mut:#666;
  --brd:rgba(255,255,255,0.08);
}
html,body{background:var(--bg);color:var(--ink);font-family:'Oswald',sans-serif;overflow-x:hidden;}

body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
  pointer-events:none;z-index:999;
}

/* ── TOP BAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:2px solid var(--gold);
  background:#000;position:sticky;top:0;z-index:10;
}
.topbar-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:0.06em;line-height:1;color:#fff;}
.topbar-logo span{color:var(--gold);}
.live-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--red);border-radius:3px;
  padding:4px 10px;font-size:0.58rem;font-weight:600;letter-spacing:0.12em;color:#fff;
  animation:flashLive 2s ease-in-out infinite;
}
.live-dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:blinkFast 0.8s infinite;}
@keyframes flashLive{0%,100%{opacity:1}50%{opacity:0.8}}
@keyframes blinkFast{0%,100%{opacity:1}50%{opacity:0}}
.topbar-clock{font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--mut);}

/* ── TIMER ── */
.timer-hero{padding:14px 16px;border-bottom:1px solid var(--brd);display:none;}
.timer-hero.visible{display:block;}
.timer-lbl{font-size:0.48rem;letter-spacing:0.2em;color:var(--mut);margin-bottom:4px;}
.timer-digs{font-family:'Bebas Neue',sans-serif;font-size:3.5rem;letter-spacing:0.06em;line-height:1;color:var(--gold);}
.timer-digs.urgent{color:var(--red);animation:pulse 0.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.timer-bar-bg{height:3px;background:rgba(255,255,255,0.07);margin-top:8px;overflow:hidden;}
.timer-bar-fill{height:100%;background:var(--gold);transition:width 1s linear;}
.timer-bar-fill.urgent{background:var(--red);}

/* ── STATS ── */
.stats-bar{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--brd);}
.stat-cell{padding:12px 10px;text-align:center;border-right:1px solid var(--brd);}
.stat-cell:last-child{border-right:none;}
.stat-n{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;line-height:1;color:#fff;}
.stat-n.g{color:var(--green);}
.stat-n.r{color:var(--red);}
.stat-n.b{color:var(--blue);}
.stat-lbl{font-size:0.44rem;letter-spacing:0.18em;color:var(--mut);margin-top:3px;}

/* ── RESUMEN BEBIDAS ── */
.resumen-section{padding:12px 14px;border-bottom:1px solid var(--brd);}
.section-title{font-size:0.44rem;letter-spacing:0.2em;color:var(--mut);margin-bottom:10px;}
.beb-group{margin-bottom:8px;}
.beb-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:var(--panel);border-radius:4px;
  margin-bottom:4px;
}
.beb-icon{font-size:1.2rem;flex-shrink:0;}
.beb-name{flex:1;font-size:0.78rem;font-weight:600;color:var(--ink);letter-spacing:0.03em;}
.beb-count{
  font-family:'Bebas Neue',sans-serif;font-size:1.3rem;
  color:var(--gold);line-height:1;margin-right:4px;
}
.beb-bar-bg{height:3px;background:rgba(255,255,255,0.07);margin-top:4px;border-radius:1px;overflow:hidden;}
.beb-bar-fill{height:100%;background:var(--gold);border-radius:1px;}
.beb-names{font-size:0.52rem;color:var(--mut);margin-top:3px;line-height:1.4;}

/* ── SCOREBOARD ── */
.board-section{padding:0;}
.board-head{
  display:grid;grid-template-columns:28px 1fr auto 52px;
  padding:6px 14px;
  background:rgba(255,255,255,0.03);
  font-size:0.42rem;letter-spacing:0.18em;color:var(--mut);
  border-bottom:1px solid var(--brd);
}
.board-row{
  display:grid;grid-template-columns:28px 1fr auto 52px;
  padding:9px 14px;border-bottom:1px solid rgba(255,255,255,0.04);
  align-items:center;
}
.board-row.ok{background:rgba(46,204,113,0.05);}
.board-row.pending{opacity:0.5;}
.row-num{font-family:'DM Mono',monospace;font-size:0.55rem;color:var(--mut);text-align:center;}
.row-av{width:26px;height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:0.6rem;color:#000;font-weight:700;flex-shrink:0;}
.row-name-wrap{display:flex;align-items:center;gap:7px;}
.row-name{font-size:0.75rem;font-weight:600;color:var(--ink);letter-spacing:0.03em;}
.row-adm{font-size:0.4rem;color:rgba(245,197,24,0.7);letter-spacing:0.1em;margin-top:1px;}
.row-drink{font-size:0.55rem;color:var(--mut);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}
.row-right{text-align:right;}
.row-status{font-size:0.75rem;}
.row-hora{font-family:'DM Mono',monospace;font-size:0.48rem;color:var(--mut);}

/* ── TOTAL ── */
.total-bar{
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid var(--brd);background:rgba(245,197,24,0.04);
  display:none;
}
.total-lbl{font-size:0.48rem;letter-spacing:0.2em;color:var(--mut);}
.total-num{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--gold);}

/* ── EMPTY ── */
.empty{padding:40px 20px;text-align:center;color:var(--mut);}
.empty-big{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:0.06em;margin-bottom:6px;color:#333;}
.empty-sub{font-size:0.58rem;letter-spacing:0.1em;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">MESA DE <span>GALANES</span></div>
  <div class="live-pill"><div class="live-dot"></div>EN VIVO</div>
  <div class="topbar-clock" id="clock">--:--</div>
</div>

<div class="timer-hero" id="timer-hero">
  <div class="timer-lbl" id="timer-lbl">⏱ CIERRA EN</div>
  <div class="timer-digs" id="timer-digs">—</div>
  <div class="timer-bar-bg"><div class="timer-bar-fill" id="timer-fill" style="width:100%"></div></div>
</div>

<div class="stats-bar">
  <div class="stat-cell"><div class="stat-n g" id="s-ped">—</div><div class="stat-lbl">PEDIDOS</div></div>
  <div class="stat-cell"><div class="stat-n r" id="s-esp">—</div><div class="stat-lbl">ESPERANDO</div></div>
  <div class="stat-cell"><div class="stat-n b" id="s-tot">—</div><div class="stat-lbl">GALANES</div></div>
</div>

<div id="resumen-section"></div>
<div id="board-section"></div>
<div class="total-bar" id="total-bar"><div class="total-lbl">RECAUDADO</div><div class="total-num" id="total-num"></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const FC={apiKey:"AIzaSyCmFMOjuGfCAtMaexe_c-wwGaV5RJBHJgk",authDomain:"mesa-galanes.firebaseapp.com",databaseURL:"https://mesa-galanes-default-rtdb.firebaseio.com",projectId:"mesa-galanes",storageBucket:"mesa-galanes.firebasestorage.app",messagingSenderId:"501258939600",appId:"1:501258939600:web:148124c66cfd41741e82d5"};
const db=getDatabase(initializeApp(FC));
let orders={},confirmed={},galanes=[],timerD=null,pagos={},timerIv=null;

function col(n){const c=["#f5c518","#2ecc71","#3498db","#e67e22","#9b59b6","#e91e63","#1abc9c","#2980b9","#f39c12","#8e44ad"];let h=0;for(let x of(n||""))h=(h*31+x.charCodeAt(0))%c.length;return c[h];}
function ini(n){const p=(n||"").trim().split(/\s+/);return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():(n||"??").slice(0,2).toUpperCase();}
function hora(ts){if(!ts)return"";const d=new Date(ts);return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");}

// Reloj
setInterval(()=>{const n=new Date();document.getElementById("clock").textContent=n.getHours()+":"+String(n.getMinutes()).padStart(2,"0")+":"+String(n.getSeconds()).padStart(2,"0");},1000);

onValue(ref(db,"pedido/orders"),s=>{orders=s.exists()?s.val():{};render();});
onValue(ref(db,"pedido/confirmed"),s=>{confirmed=s.exists()?s.val():{};render();});
onValue(ref(db,"config/galanes"),s=>{galanes=s.exists()?s.val():[];render();});
onValue(ref(db,"pedido/pagos"),s=>{pagos=s.exists()?s.val():{};render();});
onValue(ref(db,"pedido/timer"),s=>{
  timerD=s.exists()?s.val():null;
  if(timerIv){clearInterval(timerIv);timerIv=null;}
  if(timerD){tickTimer();timerIv=setInterval(tickTimer,1000);}
  else document.getElementById("timer-hero").classList.remove("visible");
});

function tickTimer(){
  const hero=document.getElementById("timer-hero");
  if(!timerD){hero.classList.remove("visible");return;}
  hero.classList.add("visible");
  const rem=timerD.endsAt-Date.now();
  const digs=document.getElementById("timer-digs");
  const fill=document.getElementById("timer-fill");
  const lbl=document.getElementById("timer-lbl");
  if(rem<=0){digs.textContent="00:00";digs.className="timer-digs urgent";lbl.textContent="⏰ PEDIDO CERRADO";if(fill)fill.style.width="0%";return;}
  const urg=rem<60000,m=Math.floor(rem/60000),s=Math.floor((rem%60000)/1000);
  digs.textContent=(m>0?m+":":"")+String(s).padStart(2,"0");
  digs.className="timer-digs"+(urg?" urgent":"");
  lbl.textContent=urg?"⚠️ ÚLTIMO MINUTO":"⏱ CIERRA EN";
  if(fill){fill.style.width=Math.max(0,(rem/(timerD.minutes*60000))*100)+"%";fill.className="timer-bar-fill"+(urg?" urgent":"");}
}

function render(){
  // Mapa pedidos por galan
  const pedMap={};
  Object.values(orders).forEach(o=>{if(!o.player)return;if(!pedMap[o.player])pedMap[o.player]=[];pedMap[o.player].push(o);});
  const conPed=Object.keys(pedMap);
  const lista=galanes.length?galanes:[...conPed];
  const sinPed=lista.filter(g=>!conPed.includes(g));
  const totalPed=conPed.length;

  // Stats
  document.getElementById("s-ped").textContent=totalPed;
  document.getElementById("s-esp").textContent=sinPed.length;
  document.getElementById("s-tot").textContent=lista.length;

  // ── RESUMEN BEBIDAS ─────────────────────────────────────
  const bebMap={};
  Object.values(orders).forEach(o=>{
    const key=(o.drink||"?")+(o.extra?(" + "+o.extra):"");
    if(!bebMap[key])bebMap[key]={icon:o.icon||"☕",count:0,players:[],drink:o.drink,extra:o.extra};
    bebMap[key].count++;
    bebMap[key].players.push(o.player||"?");
  });
  const bebs=Object.entries(bebMap).sort((a,b)=>b[1].n-a[1].n);
  const maxBeb=bebs.length?Math.max(...bebs.map(b=>b[1].count)):1;

  let resHtml="";
  if(bebs.length){
    resHtml=`<div class="resumen-section">
      <div class="section-title">RESUMEN DE PEDIDOS</div>`;
    bebs.forEach(([key,v])=>{
      const pct=Math.round((v.count/maxBeb)*100);
      resHtml+=`<div class="beb-row">
        <div class="beb-icon">${v.icon}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px">
            <div class="beb-name">${key}</div>
            <div class="beb-count">${v.count}x</div>
          </div>
          <div class="beb-bar-bg"><div class="beb-bar-fill" style="width:${pct}%"></div></div>
          <div class="beb-names">${v.players.join(" · ")}</div>
        </div>
      </div>`;
    });
    resHtml+="</div>";
  }
  document.getElementById("resumen-section").innerHTML=resHtml;

  // ── SCOREBOARD ──────────────────────────────────────────
  const ordenados=[...lista.filter(g=>conPed.includes(g)),...lista.filter(g=>!conPed.includes(g))];
  let bHtml=`<div class="board-section">
    <div class="board-head"><span>#</span><span>GALAN</span><span>PEDIDO</span><span style="text-align:right">HORA</span></div>`;

  if(!ordenados.length){
    bHtml+=`<div class="empty"><div class="empty-big">NADIE SE ANOTÓ TODAVÍA</div><div class="empty-sub">ESPERANDO PEDIDOS...</div></div>`;
  } else {
    ordenados.forEach((name,i)=>{
      const peds=pedMap[name]||[];
      const ok=peds.length>0;
      const conf=confirmed[name]&&(confirmed[name]===true||confirmed[name].ok);
      const byAdmin=peds.some(p=>p.loadedBy==="admin");
      const drinkTxt=ok?peds.map(p=>(p.icon||"☕")+" "+(p.drink||"?")+(p.extra?" + "+p.extra:"")).join(" / "):"—";
      const h=ok&&peds[0].ts?hora(peds[0].ts):"";
      bHtml+=`<div class="board-row ${ok?"ok":"pending"}">
        <div class="row-num">${i+1}</div>
        <div class="row-name-wrap">
          <div class="row-av" style="background:${col(name)}">${ini(name)}</div>
          <div>
            <div class="row-name">${name.toUpperCase()}</div>
            ${byAdmin?`<div class="row-adm">ADM</div>`:""}
          </div>
        </div>
        <div class="row-drink">${drinkTxt}</div>
        <div class="row-right">
          <div class="row-status">${conf?`<span style="color:#2ecc71">✓</span>`:ok?`<span style="color:#555">○</span>`:`<span style="color:#333">·</span>`}</div>
          ${h?`<div class="row-hora">${h}</div>`:""}
        </div>
      </div>`;
    });
  }
  bHtml+="</div>";
  document.getElementById("board-section").innerHTML=bHtml;

  // Total
  let tot=0;Object.values(pagos).forEach(p=>{tot+=(p.cash||0)+(p.transfer||0);});
  const totBar=document.getElementById("total-bar");
  if(tot>0){totBar.style.display="flex";document.getElementById("total-num").textContent="$"+Math.round(tot).toLocaleString("es-AR");}
  else totBar.style.display="none";
}
</script>
</body>
</html>
